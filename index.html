<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#efe9d9">
<title>AniList — treshu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap');

:root {
  --bg:       #0e0f1e;
  --surface:  #161729;
  --surface2: #1c1d30;
  --white:    #e8e6f0;
  --rose:     #d94f80;
  --gold:     #b89a5a;
  --muted:    rgba(232,230,240,0.38);
  --dim:      rgba(232,230,240,0.14);
  --airing:   #ff3d81;
  --finished: #facc15;
  --upcoming: #4f8fff;
  --unknown:  rgba(232,230,240,0.2);
  --ink:       #2c2415;
  --ink-muted: rgba(44,36,21,0.82);
  --ink-dim:   rgba(44,36,21,0.18);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #efe9d9;
  color: var(--ink);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── gold glitter (dense at top, fading to bare at bottom) ── */
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(circle, #e6cf8c 2.6px, transparent 2.6px),
    radial-gradient(circle at 30% 65%, #d4ad3f 1.6px, transparent 1.6px),
    radial-gradient(circle at 70% 30%, #a97e22 1.6px, transparent 1.6px),
    radial-gradient(circle at 12% 20%, #c39a2e 1.1px, transparent 1.1px),
    radial-gradient(circle at 78% 78%, #d4ad3f 1px, transparent 1px),
    radial-gradient(circle at 55% 12%, #a97e22 0.9px, transparent 0.9px),
    radial-gradient(circle at 35% 90%, #c39a2e 0.8px, transparent 0.8px),
    radial-gradient(circle at 90% 50%, #e6cf8c 1.3px, transparent 1.3px),
    radial-gradient(circle at 20% 45%, #a97e22 0.7px, transparent 0.7px),
    radial-gradient(circle at 85% 15%, #c39a2e 0.9px, transparent 0.9px),
    radial-gradient(circle at 45% 40%, #e6cf8c 2px, transparent 2px),
    radial-gradient(circle at 15% 78%, #a97e22 1.3px, transparent 1.3px),
    radial-gradient(circle at 68% 8%, #d4ad3f 1.5px, transparent 1.5px),
    radial-gradient(circle at 92% 62%, #c39a2e 1.1px, transparent 1.1px);
  background-position:
    0 0, 0 0, 20px 34px, 34px 6px, 8px 30px, 30px 18px, 4px 40px, 40px 22px, 16px 8px, 38px 36px,
    12px 50px, 55px 10px, 25px 62px, 60px 30px;
  background-size:
    44px 44px, 44px 44px, 44px 44px, 44px 44px, 44px 44px, 44px 44px, 44px 44px, 44px 44px, 44px 44px, 44px 44px,
    71px 71px, 71px 71px, 71px 71px, 71px 71px;
  background-repeat: repeat;
  mask-image: linear-gradient(to bottom, black 0%, black 28%, rgba(0,0,0,0.4) 55%, transparent 85%);
  -webkit-mask-image: linear-gradient(to bottom, black 0%, black 28%, rgba(0,0,0,0.4) 55%, transparent 85%);
}

body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 50;
  opacity: 0.018;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px;
}

/* ── layout ── */
.wrap {
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: calc(52px + env(safe-area-inset-top)) 20px calc(80px + env(safe-area-inset-bottom));
}

/* ── masthead ── */
.masthead {
  margin-bottom: 32px;
  border-bottom: 1px solid var(--ink-dim);
  padding-bottom: 22px;
}
.masthead-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.masthead h1 {
  font-family: 'Shippori Mincho', serif;
  font-weight: 500;
  font-size: clamp(26px, 6vw, 38px);
  color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1;
}
.masthead h1 em {
  font-style: italic;
  color: var(--rose);
}
.avatar {
  position: fixed;
  top: calc(20px + env(safe-area-inset-top));
  right: calc(20px + env(safe-area-inset-right));
  width: 34px;
  height: 34px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--rose);
  box-shadow: 0 0 0 3px rgba(217,79,128,0.22);
  flex-shrink: 0;
  z-index: 60;
  cursor: pointer;
}

/* ── account overview popup (comic speech-bubble) ── */
.account-popup {
  position: fixed;
  top: calc(66px + env(safe-area-inset-top));
  right: calc(20px + env(safe-area-inset-right));
  width: 232px;
  z-index: 70;
  font-family: 'DM Mono', monospace;
  animation: popIn 0.18s ease both;
}
.account-popup[hidden] { display: none; }

@keyframes popIn {
  from { opacity: 0; transform: translateY(-6px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.popup-shadow {
  position: absolute;
  top: 9px;
  left: -9px;
  width: 100%;
  height: 100%;
  border-radius: 18px;
  background-image: radial-gradient(circle, #2c2415 1.2px, transparent 1.2px);
  background-size: 6px 6px;
  opacity: 0.5;
  z-index: 0;
}

.popup-tail {
  position: absolute;
  top: -18px;
  right: 26px;
  z-index: 1;
  display: block;
}

.popup-card {
  position: relative;
  z-index: 2;
  background: #f7f2e3;
  border: 2px solid #2c2415;
  border-radius: 18px;
  padding: 14px 16px 12px;
  color: #2c2415;
}

.popup-user {
  font-family: 'Shippori Mincho', serif;
  font-weight: 500;
  font-size: 16px;
  letter-spacing: 0.01em;
  margin-bottom: 10px;
}

.popup-divider {
  height: 1px;
  background: rgba(44,36,21,0.18);
  margin-bottom: 10px;
}

.popup-stat {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 11px;
  padding: 3px 0;
  gap: 10px;
}
.popup-label {
  color: rgba(44,36,21,0.6);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 9.5px;
}
.popup-val {
  color: var(--rose);
  font-weight: 500;
  letter-spacing: 0.02em;
}

/* ── auth controls inside popup ── */
.popup-connect-btn {
  width: 100%;
  background: transparent;
  border: 1.5px solid #2c2415;
  border-radius: 10px;
  padding: 8px 10px;
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.05em;
  color: #2c2415;
  cursor: pointer;
}
.popup-connect-btn:active { background: rgba(44,36,21,0.08); }
.popup-token-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.popup-token-row input {
  flex: 1;
  min-width: 0;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  padding: 7px 8px;
  border: 1.5px solid rgba(44,36,21,0.4);
  border-radius: 8px;
  background: #fffdf6;
  color: #2c2415;
}
.popup-token-row button {
  border: 1.5px solid #2c2415;
  border-radius: 8px;
  background: #2c2415;
  color: #f7f2e3;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  padding: 0 10px;
  cursor: pointer;
}
.popup-hint {
  font-size: 9px;
  color: rgba(44,36,21,0.55);
  margin-top: 6px;
  line-height: 1.4;
}
.popup-connected {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10.5px;
  color: #2c2415;
}
.popup-connected .dot { color: var(--rose); margin-right: 4px; }
.popup-disconnect-btn {
  background: none;
  border: none;
  color: rgba(44,36,21,0.55);
  font-family: 'DM Mono', monospace;
  font-size: 9.5px;
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
}

/* ── episode increment control ── */
.ep-increment {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  appearance: none;
  -webkit-appearance: none;
  min-width: 0;
  min-height: 0;
  width: 12px;
  height: 12px;
  padding: 0;
  margin: 0 0 1px 3px;
  border: 1px solid var(--rose);
  border-radius: 50%;
  background: rgba(217,79,128,0.12);
  color: var(--rose);
  font-family: 'DM Mono', monospace;
  font-size: 7px;
  line-height: 1;
  vertical-align: middle;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
}
.ep-increment:active { transform: scale(0.88); background: rgba(217,79,128,0.28); }
.ep-increment:disabled { opacity: 0.5; cursor: default; }
.masthead-meta {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  text-align: right;
  line-height: 1.6;
}
.masthead-sub {
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 10px;
  letter-spacing: 0.04em;
}

/* ── tabs ── */
.tab-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 22px;
}
.tab-btn {
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid var(--ink-dim);
  border-radius: 999px;
  color: var(--ink-muted);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 7px 16px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.tab-btn:hover { color: var(--rose); border-color: var(--rose); }
.tab-btn.active { background: var(--rose); border-color: var(--rose); color: #fff; }

/* ── legend ── */
.legend {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.legend-dot.airing   { background: var(--airing); box-shadow: 0 0 6px var(--airing); }
.legend-dot.finished { background: var(--finished); box-shadow: 0 0 6px var(--finished); }
.legend-dot.upcoming { background: var(--upcoming); box-shadow: 0 0 6px var(--upcoming); }

/* ── sort capsule ── */
.sort-capsule {
  position: relative;
  margin-left: auto;
}
.sort-toggle {
  background: transparent;
  border: 1px solid var(--ink-dim);
  border-radius: 999px;
  color: var(--ink-muted);
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 6px 8px 6px 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.sort-toggle:hover, .sort-toggle.open { border-color: var(--rose); color: var(--rose); }
.sort-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  transition: transform 0.25s ease, background 0.15s;
  font-size: 11px;
}
.sort-arrow:hover { background: rgba(217, 79, 128, 0.12); }
.sort-arrow.desc { transform: rotate(180deg); }
.sort-options {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: var(--surface);
  border: 1px solid rgba(232, 230, 240, 0.15);
  border-radius: 12px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
  overflow: hidden;
  min-width: 150px;
  z-index: 20;
  display: flex;
  flex-direction: column;
}
.sort-options[hidden] { display: none; }
.sort-options button {
  background: transparent;
  border: none;
  text-align: left;
  padding: 10px 14px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.05em;
  color: var(--white);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.sort-options button:hover { background: rgba(217, 79, 128, 0.14); color: var(--rose); }
.sort-options button.active { color: var(--rose); }

/* ── cards ── */
.card {
  display: flex;
  gap: 0;
  position: relative;
  background: linear-gradient(to right, var(--tint, transparent), transparent 90%), var(--surface);
  border: 1px solid rgba(232, 230, 240, 0.1);
  border-left: 3px solid var(--unknown);
  border-radius: 14px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  transition: border-color 0.2s, background 0.25s, box-shadow 0.25s, transform 0.25s;
  animation: fadeUp 0.35s ease both;
}
.card:hover {
  background: linear-gradient(to right, var(--tint, transparent), transparent 90%), var(--surface2);
  border-color: rgba(232, 230, 240, 0.2);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5);
  transform: translateY(-3px);
}
.card.airing   { border-left-color: var(--airing); }
.card.finished { border-left-color: var(--finished); }
.card.upcoming { border-left-color: var(--upcoming); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-cover {
  width: 54px;
  flex-shrink: 0;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  border-right: 1px solid rgba(232, 230, 240, 0.1);
}
.card-cover-placeholder {
  width: 54px;
  flex-shrink: 0;
  aspect-ratio: 2/3;
  background: var(--surface2);
}

.card-body {
  flex: 1;
  padding: 12px 14px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 8px;
}

.card-title {
  font-family: 'Shippori Mincho', serif;
  font-weight: 500;
  font-size: 14.5px;
  color: var(--white);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.format-pill {
  display: inline-block;
  vertical-align: middle;
  margin-left: 6px;
  padding: 1.5px 7px;
  font-family: 'DM Mono', monospace;
  font-size: 8.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  background: transparent;
  border: 1px solid rgba(232,230,240,0.16);
  border-radius: 20px;
  white-space: nowrap;
}

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
}

.card-progress {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.card-progress .cur { color: var(--white); }

.status-dot {
  position: absolute;
  right: 8px;
  bottom: 8px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  z-index: 5;
  background: var(--unknown);
}
.status-dot.airing   { background: var(--airing);   box-shadow: 0 0 7px 1px var(--airing); }
.status-dot.finished { background: var(--finished); box-shadow: 0 0 7px 1px var(--finished); }
.status-dot.upcoming { background: var(--upcoming); box-shadow: 0 0 7px 1px var(--upcoming); }


/* ── progress bar ── */
.prog-track {
  height: 1px;
  background: var(--dim);
  width: 100%;
}
.prog-fill {
  height: 100%;
  background: var(--muted);
  transition: width 0.4s ease;
}
.card.airing   .prog-fill { background: var(--rose); }
.card.finished .prog-fill { background: var(--finished); }
.card.upcoming .prog-fill { background: var(--upcoming); }

/* ── score ── */
.card-score {
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 0.06em;
}

/* ── countdown (sits inline next to score) ── */
.card-countdown {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.card-countdown .cd-num { color: var(--white); opacity: 0.75; }
.card.airing .card-countdown .cd-num { color: var(--airing); opacity: 1; }
.card.upcoming .card-countdown .cd-num { color: var(--upcoming); opacity: 1; }

/* ── loading skeleton ── */
.skeleton-card {
  display: flex;
  gap: 0;
  background: var(--surface);
  border: 1px solid rgba(232, 230, 240, 0.1);
  border-left: 3px solid var(--ink-dim);
  border-radius: 14px;
  margin-bottom: 10px;
  overflow: hidden;
}
.skeleton-cover {
  width: 54px;
  flex-shrink: 0;
  aspect-ratio: 2/3;
  background: var(--surface2);
}
.skeleton-body {
  flex: 1;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
}
.skeleton-line {
  height: 10px;
  border-radius: 5px;
  background: var(--surface2);
}
.skeleton-line.title { width: 65%; height: 13px; }
.skeleton-line.sub   { width: 40%; }
.skeleton-cover, .skeleton-line {
  animation: skeletonPulse 1.3s ease-in-out infinite;
}
.skeleton-card:nth-child(2) .skeleton-cover,
.skeleton-card:nth-child(2) .skeleton-line { animation-delay: 0.12s; }
.skeleton-card:nth-child(3) .skeleton-cover,
.skeleton-card:nth-child(3) .skeleton-line { animation-delay: 0.24s; }
.skeleton-card:nth-child(4) .skeleton-cover,
.skeleton-card:nth-child(4) .skeleton-line { animation-delay: 0.36s; }
@keyframes skeletonPulse {
  0%, 100% { opacity: 0.5; }
  50%      { opacity: 1; }
}

#listEl.is-refreshing { opacity: 0.55; pointer-events: none; transition: opacity 0.2s; }

/* ── states ── */
.state {
  font-size: 13px;
  color: var(--ink-muted);
  padding: 28px 0;
  letter-spacing: 0.04em;
}
.state.err { color: var(--rose); }

/* ── footer ── */
.foot {
  margin-top: 50px;
  border-top: 1px solid var(--ink-dim);
  padding-top: 16px;
  font-size: 10.5px;
  color: var(--ink-muted);
  letter-spacing: 0.08em;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
}

*:focus-visible { outline: 1px solid var(--rose); outline-offset: 2px; }
</style>
</head>
<body>
<img class="avatar" id="avatarImg" alt="" style="display:none;">

<div class="account-popup" id="accountPopup" hidden>
  <div class="popup-shadow"></div>
  <svg class="popup-tail" width="34" height="30" viewBox="0 0 34 30">
    <polygon points="2,28 16,28 32,2" fill="#f7f2e3" stroke="#2c2415" stroke-width="2.4" stroke-linejoin="round"/>
  </svg>
  <div class="popup-card">
    <div class="popup-row popup-user">
      <span id="popupName">—</span>
    </div>
    <div class="popup-divider"></div>
    <div class="popup-stat"><span class="popup-label">Watching</span><span class="popup-val" id="popupWatching">—</span></div>
    <div class="popup-stat"><span class="popup-label">Planning</span><span class="popup-val" id="popupPlanning">—</span></div>
    <div class="popup-stat"><span class="popup-label">Mean score</span><span class="popup-val" id="popupMeanScore">—</span></div>
    <div class="popup-stat"><span class="popup-label">Episodes watched</span><span class="popup-val" id="popupEpisodes">—</span></div>
    <div class="popup-stat"><span class="popup-label">Days watched</span><span class="popup-val" id="popupDays">—</span></div>
    <div class="popup-divider"></div>
    <div id="popupAuthSection"></div>
    <div class="popup-divider"></div>
    <div id="popupMalSection"></div>
  </div>
</div>
<div class="wrap">

  <div class="masthead">
    <div class="masthead-top">
      <h1 id="pageTitle">Currently<br><em>Watching</em></h1>
      <div class="masthead-meta" id="metaBlock">
        treshu<br>
        <span id="countLine">—</span>
      </div>
    </div>
    <div class="masthead-sub" id="subLine">Fetching list from AniList…</div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="CURRENT">Watching</button>
    <button class="tab-btn" data-tab="PLANNING">Planning</button>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot airing"></div> Airing</div>
    <div class="legend-item"><div class="legend-dot finished"></div> Finished</div>
    <div class="legend-item" id="upcomingLegend"><div class="legend-dot upcoming"></div> Upcoming</div>

    <div class="sort-capsule" id="sortCapsule">
      <button class="sort-toggle" id="sortToggle">
        <span id="sortLabel">Sort</span>
        <span class="sort-arrow" id="sortArrow">&#8593;</span>
      </button>
      <div class="sort-options" id="sortOptions" hidden></div>
    </div>

query ($name: String) {

  CurrentList: MediaListCollection(userName: $name, type: ANIME, status: CURRENT) {

async function gql(query, variables) {
  const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
  const token = getToken();
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch('https://graphql.anilist.co', {
    method: 'POST',
    headers,
    body: JSON.stringify({ query, variables })
  });
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

/* ── AniList authentication (Implicit Grant — client-side, no server needed) ──
   To enable episode editing: create an app at https://anilist.co/settings/developer,
   set its Redirect URL to https://anilist.co/api/v2/oauth/pin, then paste the
   Client ID below. */
const ANILIST_CLIENT_ID = '45726';
const TOKEN_KEY = 'anilist_token';

function getToken()   { return localStorage.getItem(TOKEN_KEY); }
function setToken(t)  { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }
function hasToken()   { return !!getToken(); }

function authUrl() {
  return `https://anilist.co/api/v2/oauth/authorize?client_id=${ANILIST_CLIENT_ID}&response_type=token`;
}

async function updateProgress(entryId, newProgress) {

/* ── MyAnimeList authentication (Authorization Code + PKCE, via a small
   Cloudflare Worker proxy — MAL's API does not support CORS, so a direct
   browser request is not possible; the proxy relays requests server-side).
   MAL only supports the PKCE "plain" method: the code_challenge sent to
   MAL is the raw code_verifier itself, not a SHA-256 hash of it. Confirmed
   against Animetail's (Aniyomi fork) working MyAnimeList tracker. */
const MAL_CLIENT_ID    = '5a004cf29c4c075d908f88959653f6c2';
// Replace with your deployed Worker's URL once it's live, e.g.
// 'https://mal-proxy.yourname.workers.dev'
const MAL_PROXY_URL    = 'https://mal-proxy.reshadatiqur.workers.dev';
const MAL_TOKEN_KEY     = 'mal_token';
const MAL_REFRESH_KEY   = 'mal_refresh_token';
const MAL_EXPIRY_KEY    = 'mal_token_expiry';
const MAL_VERIFIER_KEY  = 'mal_code_verifier';

function getMalToken()      { return localStorage.getItem(MAL_TOKEN_KEY); }
function getMalRefresh()    { return localStorage.getItem(MAL_REFRESH_KEY); }
function getMalExpiry()     { return parseInt(localStorage.getItem(MAL_EXPIRY_KEY) || '0', 10); }
function hasMalToken()      { return !!getMalToken(); }
function isMalTokenExpired(){ return !getMalExpiry() || Date.now() > getMalExpiry(); }

function setMalAuth(data) {
  localStorage.setItem(MAL_TOKEN_KEY, data.access_token);
  localStorage.setItem(MAL_REFRESH_KEY, data.refresh_token);
  localStorage.setItem(MAL_EXPIRY_KEY, String(Date.now() + (data.expires_in * 1000)));
}
function clearMalAuth() {
  localStorage.removeItem(MAL_TOKEN_KEY);
  localStorage.removeItem(MAL_REFRESH_KEY);
  localStorage.removeItem(MAL_EXPIRY_KEY);
}

function generateMalVerifier() {
  const bytes = new Uint8Array(50);
  crypto.getRandomValues(bytes);
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

function malAuthUrl() {
  const verifier = generateMalVerifier();
  localStorage.setItem(MAL_VERIFIER_KEY, verifier);
  // No redirect_uri param — MAL uses the app's registered default redirect,
  // same as the AniList gotcha found earlier. code_challenge is the raw
  // verifier (PKCE "plain" method — MAL doesn't support S256).
  return `https://myanimelist.net/v1/oauth2/authorize?client_id=${MAL_CLIENT_ID}&code_challenge=${encodeURIComponent(verifier)}&response_type=code`;
}

async function exchangeMalCode(code) {
  const verifier = localStorage.getItem(MAL_VERIFIER_KEY) || '';
  const body = new URLSearchParams({
    client_id: MAL_CLIENT_ID,
    code,
    code_verifier: verifier,
    grant_type: 'authorization_code',
  });
  const resp = await fetch(`${MAL_PROXY_URL}/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString(),
  });
  if (!resp.ok) throw new Error(`MAL token exchange failed (${resp.status})`);
  const data = await resp.json();
  setMalAuth(data);
  localStorage.removeItem(MAL_VERIFIER_KEY);
}

async function refreshMalToken() {
  const refresh = getMalRefresh();
  if (!refresh) throw new Error('No MAL refresh token stored');
  const body = new URLSearchParams({
    client_id: MAL_CLIENT_ID,
    refresh_token: refresh,
    grant_type: 'refresh_token',
  });
  const resp = await fetch(`${MAL_PROXY_URL}/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString(),
  });
  if (!resp.ok) throw new Error(`MAL token refresh failed (${resp.status})`);
  setMalAuth(await resp.json());
}

async function updateMalProgress(malId, newProgress) {
  if (isMalTokenExpired()) {
    await refreshMalToken().catch(() => { clearMalAuth(); throw new Error('MAL login expired — please reconnect'); });
  }
  const body = new URLSearchParams({ num_watched_episodes: String(newProgress) });
  const resp = await fetch(`${MAL_PROXY_URL}/api/anime/${malId}/my_list_status`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded',
      'Authorization': `Bearer ${getMalToken()}`,
    },
    body: body.toString(),
  });
  if (!resp.ok) throw new Error(`MAL update failed (${resp.status})`);
  return resp.json();
}

function renderMalAuthSection() {
  const el = document.getElementById('popupMalSection');
  if (!el) return;
  if (hasMalToken()) {
    el.innerHTML = `
      <div class="popup-label" style="margin-bottom:6px;">MyAnimeList</div>
      <div class="popup-connected">
        <span><span class="dot">●</span>Connected — episodes sync too</span>
        <button class="popup-disconnect-btn" id="malDisconnectBtn">disconnect</button>
      </div>`;
    document.getElementById('malDisconnectBtn').addEventListener('click', () => {
      clearMalAuth();
      renderMalAuthSection();
    });
  } else {
    el.innerHTML = `
      <div class="popup-label" style="margin-bottom:6px;">MyAnimeList</div>
      <button class="popup-connect-btn" id="malConnectBtn">Connect MyAnimeList</button>`;
    document.getElementById('malConnectBtn').addEventListener('click', () => {
      window.location.href = malAuthUrl();
    });
  }
}

async function handleMalRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (!code) return;
  try {
    await exchangeMalCode(code);
    renderMalAuthSection();
  } catch (err) {
    alert('MyAnimeList login failed: ' + String(err.message || err));
  } finally {
    // Clean the ?code=... out of the address bar either way.
    params.delete('code');
    const clean = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    window.history.replaceState({}, '', clean);
  }
}

const SORT_OPTIONS = {
  CURRENT:  [['alpha','A-Z'], ['airingDate','Airing Date'], ['nextAiring','Next Airing']],
  PLANNING: [['alpha','A-Z'], ['airingDate','Airing Date'], ['updated','Last Updated'], ['nextAiring','Next Airing']]
};

let dataByTab   = { CURRENT: [], PLANNING: [] };
let activeTab   = 'CURRENT';
let sortMode    = { CURRENT: { field: 'alpha', dir: 'asc' }, PLANNING: { field: 'alpha', dir: 'asc' } };
let hasCachedData = false;

const colorCache = {};

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0;
  const l = (max + min) / 2;
  const d = max - min;
  if (d !== 0) {
    s = d / (1 - Math.abs(2 * l - 1));
    switch (max) {
      case r: h = 60 * (((g - b) / d) % 6); break;
      case g: h = 60 * ((b - r) / d + 2); break;
      case b: h = 60 * ((r - g) / d + 4); break;
    }
  }
  if (h < 0) h += 360;
  return [h, s, l];
}

function hslToRgb(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60)       { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  return [
    Math.round((r + m) * 255),
    Math.round((g + m) * 255),
    Math.round((b + m) * 255)
  ];
}

function extractColor(imgEl, mediaId) {
  if (colorCache[mediaId]) {
    applyTint(mediaId, colorCache[mediaId]);
    return;
  }
  try {
    const canvas = document.createElement('canvas');
    canvas.width = 8;
    canvas.height = 12;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgEl, 0, 0, 8, 12);
    const { data } = ctx.getImageData(0, 0, 8, 12);
    let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < data.length; i += 4) {
      r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
    }
    r /= n; g /= n; b /= n;

    // push toward a deep, saturated jewel tone rather than just dimming exposure
    let [h, s, l] = rgbToHsl(r, g, b);
    s = Math.min(1, s * 1.6 + 0.15);
    l = Math.max(0.16, Math.min(0.34, l * 0.65));
    const [dr, dg, db] = hslToRgb(h, s, l);

    const rgb = `rgba(${dr}, ${dg}, ${db}, 0.8)`;
    colorCache[mediaId] = rgb;
    applyTint(mediaId, rgb);
  } catch (err) {
    // Canvas got tainted (no CORS headers on the image) — skip tinting silently.
  }
}

function applyTint(mediaId, rgb) {
  const card = document.getElementById(`card-${mediaId}`);
  if (card) card.style.setProperty('--tint', rgb);
}

function attachColorBleed() {
  document.querySelectorAll('.card-cover[data-card-id]').forEach(img => {
    const id = img.dataset.cardId;
    if (img.complete && img.naturalWidth) {
      extractColor(img, id);
    } else {
      img.addEventListener('load', () => extractColor(img, id), { once: true });
    }
  });
}

function airingClass(media) {
  if (media.status === 'RELEASING') return 'airing';
  if (media.status === 'FINISHED')  return 'finished';
  if (media.status === 'NOT_YET_RELEASED') return 'upcoming';
  return '';
}

function statusLabel(media) {
  if (media.status === 'RELEASING') return 'Airing';
  if (media.status === 'FINISHED')  return 'Finished';
  if (media.status === 'NOT_YET_RELEASED') return 'Upcoming';
  return 'Unknown';
}

function formatLabel(fmt) {
  const map = { TV: 'TV', TV_SHORT: 'TV Short', MOVIE: 'Movie', SPECIAL: 'Special', OVA: 'OVA', ONA: 'ONA', MUSIC: 'Music' };
  return map[fmt] || fmt;
}

function formatCountdown(airingAtSeconds) {
  const diffMs = airingAtSeconds * 1000 - Date.now();
  if (diffMs <= 0) return null; // already aired — let the next scheduled fetch catch up
  const totalMin = Math.floor(diffMs / 60000);
  const days  = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins  = totalMin % 60;
  if (days  > 0) return `${days}d ${hours}h`;
  if (hours > 0) return `${hours}h ${mins}m`;
  return `${mins}m`;
}

function startDateValue(media) {
  const d = media.startDate;
  if (!d || !d.year) return null;
  return d.year * 10000 + (d.month || 0) * 100 + (d.day || 0);
}

function sortEntries(entries, sort) {
  const mult = sort.dir === 'desc' ? -1 : 1;
  return [...entries].sort((a, b) => {
    if (sort.field === 'alpha') {
      return mult * (a.media.title.userPreferred || '').localeCompare(b.media.title.userPreferred || '');
    }
    if (sort.field === 'airingDate') {
      const da = startDateValue(a.media), db = startDateValue(b.media);
      if (da === null && db === null) return 0;
      if (da === null) return 1;   // titles with no known start date sink to the bottom either way
      if (db === null) return -1;
      return mult * (da - db);
    }
    if (sort.field === 'updated') {
      return mult * ((a.updatedAt || 0) - (b.updatedAt || 0));
    }
    if (sort.field === 'nextAiring') {
      const na = a.media.nextAiringEpisode?.airingAt, nb = b.media.nextAiringEpisode?.airingAt;
      if (na == null && nb == null) return 0;
      if (na == null) return 1;    // nothing upcoming sinks to the bottom either way
      if (nb == null) return -1;
      return mult * (na - nb);
    }
    return 0;
  });
}

function renderSortCapsule() {
  const opts       = SORT_OPTIONS[activeTab];
  const current    = sortMode[activeTab];
  const optionsEl  = document.getElementById('sortOptions');
  const labelEl    = document.getElementById('sortLabel');
  const arrowEl    = document.getElementById('sortArrow');

  const validFields = opts.map(([val]) => val);
  if (!validFields.includes(current.field)) current.field = 'alpha';

  const currentLabel = opts.find(([val]) => val === current.field)?.[1] || 'Sort';
  labelEl.textContent = currentLabel;
  arrowEl.classList.toggle('desc', current.dir === 'desc');

  optionsEl.innerHTML = opts.map(([val, label]) =>
    `<button data-sort="${val}" class="${val === current.field ? 'active' : ''}">${label}</button>`
  ).join('');

  optionsEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      sortMode[activeTab].field = btn.dataset.sort;
      optionsEl.hidden = true;
      document.getElementById('sortToggle').classList.remove('open');
      renderSortCapsule();
      renderCards();
    });
  });
}

function initSortCapsule() {
  const toggle    = document.getElementById('sortToggle');
  const arrow     = document.getElementById('sortArrow');
  const optionsEl = document.getElementById('sortOptions');

  toggle.addEventListener('click', () => {
    const willOpen = optionsEl.hidden;
    optionsEl.hidden = !willOpen;
    toggle.classList.toggle('open', willOpen);
  });

  arrow.addEventListener('click', (e) => {
    e.stopPropagation();
    const current = sortMode[activeTab];
    current.dir = current.dir === 'asc' ? 'desc' : 'asc';
    arrow.classList.toggle('desc', current.dir === 'desc');
    renderCards();
  });

  document.addEventListener('click', (e) => {
    if (!document.getElementById('sortCapsule').contains(e.target)) {
      optionsEl.hidden = true;
      toggle.classList.remove('open');
    }
  });
}

function renderSkeleton(count = 4) {
  const el = document.getElementById('listEl');
  el.innerHTML = Array.from({ length: count }).map(() => `
    <div class="skeleton-card">
      <div class="skeleton-cover"></div>
      <div class="skeleton-body">
        <div class="skeleton-line title"></div>
        <div class="skeleton-line sub"></div>
      </div>
    </div>`).join('');
}

function renderCards() {
  const el = document.getElementById('listEl');
  const entries = dataByTab[activeTab];

  if (!entries.length) {
    el.innerHTML = activeTab === 'CURRENT'
      ? '<div class="state">No currently watching entries found.</div>'
      : '<div class="state">No planned titles found.</div>';
    return;
  }

  el.innerHTML = sortEntries(entries, sortMode[activeTab]).map((e, i) => {
    const m     = e.media;
    const title = m.title.userPreferred || m.title.romaji || 'Unknown';
    const cover = m.coverImage?.medium || '';
    const cls   = airingClass(m);
    const lbl   = statusLabel(m);

    if (activeTab === 'CURRENT') {
      const cur      = e.progress ?? 0;
      const total    = m.episodes;
      const airing   = m.nextAiringEpisode?.episode;
      const maxKnown = airing ? airing - 1 : total;
      const pctBase  = total || maxKnown;
      const pct      = pctBase ? Math.min(100, Math.round((cur / pctBase) * 100)) : null;
      const totalStr = total ? `/ ${total}` : `/ ?`;
      const rawScore = e.score || m.averageScore;
      const scoreDec = rawScore ? (rawScore > 10 ? (rawScore / 10).toFixed(1) : rawScore.toFixed(1)) : null;
      const nextEp   = m.nextAiringEpisode;
      const cd       = nextEp ? formatCountdown(nextEp.airingAt) : null;
      const isCaughtUp = maxKnown && cur >= maxKnown;

      return `
      <div class="card ${cls}" id="card-${m.id}" style="animation-delay:${i * 0.04}s">
        <span class="status-dot ${cls}"></span>
        ${cover ? `<img class="card-cover" src="${cover}" alt="" loading="lazy" crossorigin="anonymous" data-card-id="${m.id}">` : `<div class="card-cover-placeholder"></div>`}
        <div class="card-body">
          <div class="card-title" title="${title}">${title}${m.format ? ` <span class="format-pill">${formatLabel(m.format)}</span>` : ''}</div>
          <div class="prog-track"><div class="prog-fill" style="width:${pct !== null ? pct : 0}%"></div></div>
          <div class="card-foot">
            <div class="card-progress">
              Ep <span class="cur">${cur}</span>${hasToken() ? `<button class="ep-increment" data-entry-id="${e.id}" data-media-id="${m.id}" data-mal-id="${m.idMal || ''}" data-cur="${cur}" data-total="${total || ''}" aria-label="Mark next episode watched">+</button>` : ''} ${totalStr}${scoreDec ? ` · <span class="card-score">${scoreDec}</span>` : ''}${isCaughtUp ? ' · <span style="color:var(--rose)">up to date</span>' : (cd ? ` · <span class="card-countdown">Ep ${nextEp.episode} in <span class="cd-num">${cd}</span></span>` : '')}
            </div>
          </div>
        </div>
      </div>`;
    } else {
      const total    = m.episodes;
      const totalStr = total ? `${total} eps` : 'eps unknown';
      const scoreDec = m.averageScore ? (m.averageScore / 10).toFixed(1) : null;
      const nextEp   = m.nextAiringEpisode;
      const cd       = nextEp ? formatCountdown(nextEp.airingAt) : null;

      return `
      <div class="card ${cls}" id="card-${m.id}" style="animation-delay:${i * 0.04}s">
        <span class="status-dot ${cls}"></span>
        ${cover ? `<img class="card-cover" src="${cover}" alt="" loading="lazy" crossorigin="anonymous" data-card-id="${m.id}">` : `<div class="card-cover-placeholder"></div>`}
        <div class="card-body">
          <div class="card-title" title="${title}">${title}${m.format ? ` <span class="format-pill">${formatLabel(m.format)}</span>` : ''}</div>
          <div class="card-foot">
            <div class="card-progress">${totalStr}${scoreDec ? ` · <span class="card-score">${scoreDec}</span>` : ''}${cd ? ` · <span class="card-countdown">${nextEp.episode === 1 ? 'Premieres' : `Ep ${nextEp.episode}`} in <span class="cd-num">${cd}</span></span>` : ''}</div>
          </div>
        </div>
      </div>`;
    }
  }).join('');

  attachColorBleed();
}

function updateHeader() {
  const titleEl = document.getElementById('pageTitle');
  const countEl = document.getElementById('countLine');
  const upcomingLegend = document.getElementById('upcomingLegend');
  if (upcomingLegend) upcomingLegend.style.display = activeTab === 'PLANNING' ? 'flex' : 'none';
  if (activeTab === 'CURRENT') {
    titleEl.innerHTML = 'Currently<br><em>Watching</em>';
    countEl.textContent = `${dataByTab.CURRENT.length} titles watching`;
  } else {
    titleEl.innerHTML = 'Planning<br><em>to Watch</em>';
    countEl.textContent = `${dataByTab.PLANNING.length} titles planned`;
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateHeader();
    renderSortCapsule();
    renderCards();
  });
});

initSortCapsule();
renderSortCapsule();

function populateAccountPopup(user, tabs) {
  const stats = user.statistics?.anime;
  document.getElementById('popupName').textContent = user.name;
  document.getElementById('popupWatching').textContent = tabs.CURRENT.length;
  document.getElementById('popupPlanning').textContent = tabs.PLANNING.length;
  document.getElementById('popupMeanScore').textContent = stats?.meanScore ? (stats.meanScore / 10).toFixed(1) : '—';
  document.getElementById('popupEpisodes').textContent = stats?.episodesWatched ?? '—';
  document.getElementById('popupDays').textContent = stats?.minutesWatched
    ? (stats.minutesWatched / 60 / 24).toFixed(1)
    : '—';
}

function initAccountPopup() {
  const avatarImg = document.getElementById('avatarImg');
  const popup     = document.getElementById('accountPopup');

  avatarImg.addEventListener('click', (e) => {
    e.stopPropagation();
    popup.hidden = !popup.hidden;
  });

  document.addEventListener('click', (e) => {
    if (!popup.hidden && !popup.contains(e.target) && e.target !== avatarImg) {
      popup.hidden = true;
    }
  });
}

initAccountPopup();
renderAuthSection();
initEpisodeIncrement();
renderMalAuthSection();
handleMalRedirect();

async function load() {
  const listEl     = document.getElementById('listEl');
  const subLine    = document.getElementById('subLine');
  const t0         = Date.now();

  if (hasCachedData) {
    listEl.classList.add('is-refreshing');
  } else {
    renderSkeleton();
  }

  try {
    const data = await gql(Q, { name: USERNAME });
    if (!data.User) {
      throw new Error(`AniList user "${USERNAME}" not found`);
    }

    const avatarUrl = data.User.avatar?.medium;
    if (avatarUrl) {
      const avatarImg = document.getElementById('avatarImg');
      avatarImg.src = avatarUrl;
      avatarImg.style.display = 'block';
    }

    dataByTab.CURRENT  = (data.CurrentList?.lists  || []).flatMap(l => l.entries);
    dataByTab.PLANNING = (data.PlanningList?.lists || []).flatMap(l => l.entries);

    populateAccountPopup(data.User, dataByTab);

    const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
    updateHeader();
    subLine.textContent =
      `Updated ${new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })}`;
    document.getElementById('fetchTime').textContent = `Fetched in ${elapsed}s`;

    renderSortCapsule();
    renderCards();
    hasCachedData = true;

  } catch (err) {
    if (hasCachedData) {
      // keep the last good cached list on screen rather than blanking it on a failed refresh
      subLine.textContent = 'Refresh failed — showing last loaded data.';
    } else {
      listEl.innerHTML = `<div class="state err">Could not load list — ${err.message}</div>`;
      subLine.textContent = 'Failed to fetch.';
    }
  } finally {
    listEl.classList.remove('is-refreshing');
  }
}

load();
</script>
</body>
